# Pruebas de punta a punta (HT-14): levanta la plataforma completa de QA con las imágenes :qa de GHCR
# (el api-gateway se compila desde ESTE commit), espera los health checks y corre scripts/smoke-test.sh
# completo (MVP y sprints 2 a 6) por el gateway: REST, /api/v1, frontend, /docs y WebSocket.
#
# Cuándo: a mano (workflow_dispatch), cada noche (03:00 Colombia) y en los PR hacia main.
# Si falla, sube los logs de todos los contenedores como artifact "logs-e2e".
#
# Imágenes privadas de GHCR: se usa el secreto GHCR_TOKEN (PAT con read:packages, junto a GHCR_USER) si
# existe; si no, el GITHUB_TOKEN (sirve si cada paquete da acceso de lectura a este repo).
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PROYECTO: tripbus-qa
  # Imágenes del CI: :qa (rama develop) de los servicios; el frontend publica :develop.
  TAG: qa
  FRONTEND_TAG: develop
  WEBSOCAT_VERSION: v1.14.0

jobs:
  e2e:
    name: Plataforma de QA + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login a Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login a GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Herramientas del smoke test (jq y websocat)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q jq
          curl -fsSL -o websocat "https://github.com/vi/websocat/releases/download/${WEBSOCAT_VERSION}/websocat.x86_64-unknown-linux-musl"
          sudo install -m 755 websocat /usr/local/bin/websocat
          jq --version && websocat --version

      - name: Entorno de QA
        run: cp .env.qa.example .env.qa

      # Todo con las imágenes publicadas, salvo el api-gateway, que se compila desde este commit.
      - name: Descargar imágenes y compilar el gateway
        run: |
          C="docker compose -p $PROYECTO --env-file .env.qa -f docker-compose.yml -f docker-compose.qa.yml"
          mapfile -t SERVICIOS < <($C config --services | grep -vx api-gateway)
          $C pull "${SERVICIOS[@]}"
          $C build api-gateway

      - name: Levantar la plataforma
        run: |
          docker compose -p "$PROYECTO" --env-file .env.qa -f docker-compose.yml -f docker-compose.qa.yml up -d --no-build
          scripts/wait-healthy.sh "$PROYECTO" 900 http://localhost:18000

      - name: Smoke test completo (MVP y sprints 2 a 6)
        run: |
          MAILPIT_URL=http://localhost:18025 bash scripts/smoke-test.sh http://localhost:18000 http://localhost:18007

      - name: Logs de los contenedores
        if: failure()
        run: |
          mkdir -p logs-e2e
          docker compose -p "$PROYECTO" --env-file .env.qa -f docker-compose.yml -f docker-compose.qa.yml ps -a > logs-e2e/ps.txt || true
          for c in $(docker ps -a --filter "label=com.docker.compose.project=$PROYECTO" --format '{{.Names}}'); do
            docker logs --timestamps "$c" > "logs-e2e/$c.log" 2>&1 || true
          done

      - name: Subir logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: logs-e2e
          path: logs-e2e/
          retention-days: 7

      - name: Bajar la plataforma
        if: always()
        run: docker compose -p "$PROYECTO" --env-file .env.qa -f docker-compose.yml -f docker-compose.qa.yml down -v || true
