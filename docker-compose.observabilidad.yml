# =============================================================================
#  Observabilidad (HT-10): se agrega SOLO cuando el profile "observabilidad" está activo
#  (COMPOSE_PROFILES=observabilidad en .env.qa / .env.prod). Los scripts qa.* y prod.* lo incluyen solos:
#    docker compose ... -f docker-compose.yml -f docker-compose.<entorno>.yml -f docker-compose.observabilidad.yml
#
#  A cada servicio Java: trazas OTLP al collector, logs JSON (ECS, con traceId/spanId/requestId que Loki
#  enlaza con Tempo) y el histograma de http.server.requests (p95 por servicio en Grafana).
#  Muestreo: TRACING_SAMPLING (1.0 en QA, 0.1 por defecto).
# =============================================================================

x-obs-env: &obs-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  LOG_FORMAT: json
  TRACING_SAMPLING: ${TRACING_SAMPLING:-0.1}
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"

services:
  identity:
    environment: *obs-env
  catalog-service:
    environment: *obs-env
  seat-inventory-service:
    environment: *obs-env
  booking-payment-service:
    environment: *obs-env
  fleet-trip-events-service:
    environment: *obs-env
  flash-offers-service:
    environment:
      <<: *obs-env
      # Flash Offers usa la variable tal cual como URL de las trazas (no le agrega /v1/traces).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  realtime-gateway:
    environment: *obs-env
