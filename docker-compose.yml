# =============================================================================
#  TripBus — plataforma completa. ARCHIVO BASE: común a QA y PROD.
#
#  Este archivo NO se usa solo: siempre se combina con el override del entorno.
#    QA   (tu PC, compila desde el código, publica todos los puertos):
#         scripts/qa.ps1 up      |  scripts/qa.sh up
#    PROD (servidor, imágenes de GHCR, solo publica 18000: REST y WebSocket /ws):
#         scripts/prod.sh pull && scripts/prod.sh up
#  Los scripts ejecutan:
#    docker compose -p tripbus-<entorno> --env-file .env.<entorno> -f docker-compose.yml -f docker-compose.<entorno>.yml ...
#
#  Aquí: 6 PostgreSQL (una por servicio), Redis con contraseña, llaves JWT, los 7 microservicios,
#  el frontend, Swagger UI (/docs), el API Gateway, las copias de seguridad diarias (backups) y, con el
#  profile "observabilidad", Prometheus, OpenTelemetry Collector, Tempo, Loki, Promtail y Grafana.
#  Sin puertos publicados: los publica el override.
#  Con el profile "observabilidad" los scripts agregan docker-compose.observabilidad.yml (trazas OTLP y
#  logs JSON en los servicios Java).
#  Dentro de la red de Docker los contenedores se hablan por NOMBRE de servicio y puerto interno.
#  Los secretos llegan del archivo .env del entorno; si falta uno, compose no arranca.
# =============================================================================

# ---- Bloques reutilizables (anclas YAML) ------------------------------------------
x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  mem_limit: 256m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 10

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 640m

# Observabilidad (HT-10): solo con COMPOSE_PROFILES=observabilidad ("observability" se mantiene por
# compatibilidad con los .env anteriores).
x-observabilidad: &observabilidad
  profiles: ["observabilidad", "observability"]
  restart: unless-stopped

# Variables comunes a todos los servicios Java (cada uno agrega las suyas).
x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:?Falta SPRING_PROFILE (qa o prod) en .env.qa o .env.prod}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env.qa o .env.prod}
  DB_PORT: 5432
  TZ: America/Bogota
  # HT-13: el OpenAPI de cada servicio declara el gateway (/api/v1) para que "Try it out" de /docs pase por él.
  OPENAPI_SERVER_URL: /api/v1

x-jwks: &jwks
  IDENTITY_JWKS_URI: http://identity:18001/.well-known/jwks.json

x-internal-token: &internal-token
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Falta INTERNAL_API_TOKEN en .env.qa o .env.prod}

services:
  # ================================================================ bases de datos
  # Una PostgreSQL por servicio: cada servicio es dueño exclusivo de sus datos.
  identity-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tripbus_identity
      POSTGRES_USER: ${IDENTITY_DB_USERNAME:?Falta IDENTITY_DB_USERNAME en .env.qa o .env.prod}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Falta IDENTITY_DB_PASSWORD en .env.qa o .env.prod}
    volumes:
      - identity-db-data:/var/lib/postgresql/data

  catalog-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tripbus_catalog
      POSTGRES_USER: ${CATALOG_DB_USERNAME:?Falta CATALOG_DB_USERNAME en .env.qa o .env.prod}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Falta CATALOG_DB_PASSWORD en .env.qa o .env.prod}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

  seat-inventory-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tripbus_inventory
      POSTGRES_USER: ${INVENTORY_DB_USERNAME:?Falta INVENTORY_DB_USERNAME en .env.qa o .env.prod}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Falta INVENTORY_DB_PASSWORD en .env.qa o .env.prod}
    volumes:
      - seat-inventory-db-data:/var/lib/postgresql/data

  booking-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tripbus_booking
      POSTGRES_USER: ${BOOKING_DB_USERNAME:?Falta BOOKING_DB_USERNAME en .env.qa o .env.prod}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Falta BOOKING_DB_PASSWORD en .env.qa o .env.prod}
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  fleet-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tripbus_fleet
      POSTGRES_USER: ${FLEET_DB_USERNAME:?Falta FLEET_DB_USERNAME en .env.qa o .env.prod}
      POSTGRES_PASSWORD: ${FLEET_DB_PASSWORD:?Falta FLEET_DB_PASSWORD en .env.qa o .env.prod}
    volumes:
      - fleet-db-data:/var/lib/postgresql/data

  offers-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tripbus_offers
      POSTGRES_USER: ${OFFERS_DB_USERNAME:?Falta OFFERS_DB_USERNAME en .env.qa o .env.prod}
      POSTGRES_PASSWORD: ${OFFERS_DB_PASSWORD:?Falta OFFERS_DB_PASSWORD en .env.qa o .env.prod}
    volumes:
      - offers-db-data:/var/lib/postgresql/data

  # ================================================================ Redis (eventos, locks, cache)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env.qa o .env.prod}"]
    environment:
      # redis-cli lee la contraseña de aquí (así no aparece en la línea de comandos).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Contenedor de un solo uso: genera el par RSA con el que identity firma los JWT si aún no existe
  # (queda en el volumen jwt-keys y se reutiliza en cada arranque).
  jwt-keys:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ ! -f /keys/private.pem ]; then
          apk add --no-cache openssl > /dev/null &&
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/private.pem &&
          openssl rsa -in /keys/private.pem -pubout -out /keys/public.pem &&
          chmod 444 /keys/*.pem && echo "Llaves JWT generadas";
        else echo "Llaves JWT ya existen"; fi
    volumes:
      - jwt-keys:/keys

  # ================================================================ microservicios
  identity:
    <<: *java-service
    image: ghcr.io/trip-bus/identity:${TAG:-prod}
    environment:
      <<: [*common-env, *internal-token]
      SERVER_PORT: 18001
      DB_HOST: identity-db
      DB_NAME: tripbus_identity
      DB_USERNAME: ${IDENTITY_DB_USERNAME}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      # Identity valida con Catalog que la empresa exista al crear un OPERADOR.
      CATALOG_URL: http://catalog-service:18002
      FRONTEND_URL: ${FRONTEND_URL:?Falta FRONTEND_URL en .env.qa o .env.prod}
      # Login con Google: vacío = desactivado (/auth/google responde 404).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Verificación en dos pasos (US-106): llave que cifra los secretos TOTP (obligatoria en qa y prod;
      # sin ella identity no arranca) y roles que deben activarla antes de usar la API (vacío = nadie).
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Falta MFA_ENCRYPTION_KEY en .env.qa o .env.prod}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwt-keys:
        condition: service_completed_successfully

  catalog-service:
    <<: *java-service
    image: ghcr.io/trip-bus/catalog-service:${TAG:-prod}
    environment:
      <<: [*common-env, *jwks, *internal-token]
      SERVER_PORT: 18002
      DB_HOST: catalog-db
      DB_NAME: tripbus_catalog
      DB_USERNAME: ${CATALOG_DB_USERNAME}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      SEAT_INVENTORY_URL: http://seat-inventory-service:18003
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  seat-inventory-service:
    <<: *java-service
    image: ghcr.io/trip-bus/seat-inventory-service:${TAG:-prod}
    environment:
      <<: [*common-env, *jwks, *internal-token]
      SERVER_PORT: 18003
      DB_HOST: seat-inventory-db
      DB_NAME: tripbus_inventory
      DB_USERNAME: ${INVENTORY_DB_USERNAME}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      CATALOG_URL: http://catalog-service:18002
    depends_on:
      seat-inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-payment-service:
    <<: *java-service
    image: ghcr.io/trip-bus/booking-payment-service:${TAG:-prod}
    environment:
      <<: [*common-env, *jwks, *internal-token]
      SERVER_PORT: 18004
      DB_HOST: booking-db
      DB_NAME: tripbus_booking
      DB_USERNAME: ${BOOKING_DB_USERNAME}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      CATALOG_URL: http://catalog-service:18002
      SEAT_INVENTORY_URL: http://seat-inventory-service:18003
      FLASH_OFFERS_URL: http://flash-offers-service:18006
      FRONTEND_URL: ${FRONTEND_URL:?Falta FRONTEND_URL en .env.qa o .env.prod}
      TICKET_SECRET: ${TICKET_SECRET:?Falta TICKET_SECRET en .env.qa o .env.prod}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Falta PAYMENT_WEBHOOK_SECRET en .env.qa o .env.prod}
      # La pasarela sandbox llama al webhook del propio servicio por la red interna.
      PAYMENT_WEBHOOK_URL: http://booking-payment-service:18004/webhooks/payment
      # Tiquete por correo (US-033). Opcional: sin MAIL_HOST no se envía. QA usa Mailpit (override);
      # PROD, el SMTP del proveedor que se configure en .env.prod.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      booking-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  fleet-trip-events-service:
    <<: *java-service
    image: ghcr.io/trip-bus/fleet-trip-events-service:${TAG:-prod}
    environment:
      <<: [*common-env, *jwks, *internal-token]
      SERVER_PORT: 18005
      DB_HOST: fleet-db
      DB_NAME: tripbus_fleet
      DB_USERNAME: ${FLEET_DB_USERNAME}
      DB_PASSWORD: ${FLEET_DB_PASSWORD}
      CATALOG_URL: http://catalog-service:18002
      # Fleet valida con Identity que el conductor asignado exista, esté activo y sea de la empresa.
      IDENTITY_URL: http://identity:18001
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
    depends_on:
      fleet-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Repo flash-offerts-service; el nombre del servicio en la red es flash-offers-service.
  flash-offers-service:
    <<: *java-service
    image: ghcr.io/trip-bus/flash-offerts-service:${TAG:-prod}
    environment:
      <<: [*common-env, *jwks, *internal-token]
      SERVER_PORT: 18006
      DB_HOST: offers-db
      DB_NAME: tripbus_offers
      DB_USERNAME: ${OFFERS_DB_USERNAME}
      DB_PASSWORD: ${OFFERS_DB_PASSWORD}
      CATALOG_URL: http://catalog-service:18002
      SEAT_INVENTORY_URL: http://seat-inventory-service:18003
    depends_on:
      offers-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ================================================================ gateways
  # WebSocket + página de demostración. Sin base de datos (solo Redis).
  realtime-gateway:
    <<: *java-service
    mem_limit: 512m
    image: ghcr.io/trip-bus/realtime-gateway:${TAG:-prod}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      SERVER_PORT: 18007
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_JWKS_URI: http://identity:18001/.well-known/jwks.json
      SEAT_INVENTORY_URL: http://seat-inventory-service:18003
      FLASH_OFFERS_URL: http://flash-offers-service:18006
      FLEET_URL: http://fleet-trip-events-service:18005
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Falta PUBLIC_API_URL en .env.qa o .env.prod}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?Falta WS_ALLOWED_ORIGINS en .env.qa o .env.prod}
      # Detrás del gateway todas las conexiones llegan desde su IP: el límite de conexiones por IP (HT-11)
      # usa el último valor de X-Forwarded-For, que pone el gateway con la IP real del cliente.
      WS_CLIENT_IP_HEADER: X-Forwarded-For
      # Notificaciones push (US-185). Vacías = push apagado (503 PUSH_DISABLED); PROD las exige.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      OPENAPI_SERVER_URL: /api/v1
      TZ: America/Bogota
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy

  # Frontend (HT-03): SPA servida por su propio NGINX en el puerto 80. El gateway la publica en "/"; su
  # proxy interno /api y /ws apunta al gateway y al realtime por si se abre directo (solo red de Docker).
  # El CI del frontend publica los tags main, develop, latest y sha-<corto>: FRONTEND_TAG elige cuál
  # (por defecto el mismo TAG del resto).
  frontend:
    image: ghcr.io/trip-bus/frontend:${FRONTEND_TAG:-${TAG:-prod}}
    restart: unless-stopped
    mem_limit: 64m
    environment:
      FRONTEND_PORT: 80
      API_GATEWAY_URL: http://api-gateway:18000
      REALTIME_URL: http://realtime-gateway:18007

  # Documentación unificada (HT-13): Swagger UI en /docs del gateway, con un selector por servicio. Los
  # specs los sirve el gateway en /docs/specs/<servicio> (desde /v3/api-docs de cada uno).
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.29.0
    restart: unless-stopped
    mem_limit: 64m
    environment:
      BASE_URL: /docs
      PORT: 8080
      DEEP_LINKING: "true"
      PERSIST_AUTHORIZATION: "true"
      URLS_PRIMARY_NAME: catalog
      URLS: >-
        [{"name":"identity","url":"/docs/specs/identity"},
        {"name":"catalog","url":"/docs/specs/catalog"},
        {"name":"seat-inventory","url":"/docs/specs/seat-inventory"},
        {"name":"booking","url":"/docs/specs/booking"},
        {"name":"fleet","url":"/docs/specs/fleet"},
        {"name":"flash-offers","url":"/docs/specs/flash-offers"},
        {"name":"realtime","url":"/docs/specs/realtime"}]

  # API Gateway (NGINX): único punto de entrada: frontend (/), REST (también /api/v1), /docs y /ws.
  api-gateway:
    image: ghcr.io/trip-bus/api-gateway:${TAG:-prod}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      GATEWAY_PORT: 18000
      REALTIME_UPSTREAM: realtime-gateway:18007
      FRONTEND_UPSTREAM: frontend:80
      SWAGGER_UI_UPSTREAM: swagger-ui:8080
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?Falta CORS_ALLOWED_ORIGIN en .env.qa o .env.prod}
      # DNS interno de Docker; valid=10s: si un servicio se reinicia con otra IP, en <=10 s se sigue.
      RESOLVER: 127.0.0.11 valid=10s ipv6=off
      # HT-12: el banco de prueba (/sandbox/) redirige al frontend: su origen va en el form-action de la CSP.
      FRONTEND_URL: ${FRONTEND_URL:?Falta FRONTEND_URL en .env.qa o .env.prod}
      # HT-12: Strict-Transport-Security solo detrás de HTTPS (túnel con dominio propio).
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      # HT-13: /docs. El override de QA lo enciende; en PROD solo con DOCS_ENABLED=true en .env.prod.
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
    depends_on:
      identity:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      seat-inventory-service:
        condition: service_healthy
      booking-payment-service:
        condition: service_healthy
      fleet-trip-events-service:
        condition: service_healthy
      flash-offers-service:
        condition: service_healthy
      # service_started: el REST no espera al WebSocket; el upstream se re-resuelve ("resolve").
      realtime-gateway:
        condition: service_started
      frontend:
        condition: service_started
      swagger-ui:
        condition: service_started

  # ================================================================ copias de seguridad (HT-05)
  # Una vez al día (BACKUP_HOUR, hora de Colombia; 3 por defecto) hace pg_dump -Fc de las 6 bases en
  # ./backups/AAAA-MM-DD/<servicio>.dump y borra las carpetas de más de BACKUP_KEEP_DAYS días (7).
  # Copia inmediata: scripts/backup-now.sh · restaurar: scripts/restore.sh <servicio> <archivo>.
  backups:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 128m
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    command: ["loop"]
    environment:
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      INVENTORY_DB_USERNAME: ${INVENTORY_DB_USERNAME}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      BOOKING_DB_USERNAME: ${BOOKING_DB_USERNAME}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      FLEET_DB_USERNAME: ${FLEET_DB_USERNAME}
      FLEET_DB_PASSWORD: ${FLEET_DB_PASSWORD}
      OFFERS_DB_USERNAME: ${OFFERS_DB_USERNAME}
      OFFERS_DB_PASSWORD: ${OFFERS_DB_PASSWORD}
    volumes:
      - ./infra/backups/backup.sh:/backup/backup.sh:ro
      - ./backups:/backups
    depends_on:
      identity-db:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
      seat-inventory-db:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      fleet-db:
        condition: service_healthy
      offers-db:
        condition: service_healthy

  # ================================================================ observabilidad (HT-10)
  # Solo con el profile "observabilidad": COMPOSE_PROFILES=observabilidad en el .env del entorno (los
  # scripts agregan entonces docker-compose.observabilidad.yml: trazas OTLP y logs JSON en los servicios).
  #   servicios Java --OTLP/HTTP--> otel-collector --OTLP/gRPC--> tempo   (trazas)
  #   prometheus --/actuator/prometheus--> servicios                      (métricas + alertas)
  #   promtail --docker.sock--> logs de los contenedores --> loki          (logs)
  #   grafana: datasources y 3 tableros por código (infra/grafana)
  prometheus:
    <<: *observabilidad
    image: prom/prometheus:v2.54.1
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus

  otel-collector:
    <<: *observabilidad
    image: otel/opentelemetry-collector:0.135.0
    mem_limit: 128m
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  tempo:
    <<: *observabilidad
    image: grafana/tempo:2.8.2
    mem_limit: 256m
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  loki:
    <<: *observabilidad
    image: grafana/loki:3.5.5
    mem_limit: 256m
    # Configuración de un solo nodo que trae la imagen (almacenamiento en disco, esquema v13).
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    <<: *observabilidad
    image: grafana/promtail:3.5.5
    mem_limit: 128m
    command: ["-config.file=/etc/promtail/promtail.yaml", "-config.expand-env=true"]
    environment:
      # Solo los contenedores de este proyecto de compose (tripbus-qa o tripbus-prod).
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-tripbus-qa}
    volumes:
      - ./infra/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    <<: *observabilidad
    image: grafana/grafana:12.1.1
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  identity-db-data:
  catalog-db-data:
  seat-inventory-db-data:
  booking-db-data:
  fleet-db-data:
  offers-db-data:
  redis-data:
  jwt-keys:
  prometheus-data:
  grafana-data:
