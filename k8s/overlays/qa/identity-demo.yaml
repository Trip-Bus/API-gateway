# Perfil qa de identity: usuarios de demostración con esta contraseña (clave del Secret tripbus-secrets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: DEMO_USERS_PASSWORD
              valueFrom:
                secretKeyRef: { name: tripbus-secrets, key: DEMO_USERS_PASSWORD, optional: true }
