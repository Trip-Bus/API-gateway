# API Gateway (NGINX): único punto de entrada REST, expuesto con un LoadBalancer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tripbus
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: tripbus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: ghcr.io/trip-bus/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CORS_ALLOWED_ORIGIN
              value: "*"
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tripbus
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
