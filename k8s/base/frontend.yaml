# Frontend (SPA en NGINX, puerto 80). El gateway lo publica en "/".
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: nginx
          image: ghcr.io/trip-bus/frontend:main
          ports:
            - name: http
              containerPort: 80
          env:
            - name: FRONTEND_PORT
              value: "80"
            - name: API_GATEWAY_URL
              value: http://api-gateway:18000
            - name: REALTIME_URL
              value: http://realtime-gateway:18007
          livenessProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /salud, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
