# API Gateway (NGINX): frontend (/), REST (también /api/v1) y WebSocket (/ws). Las upstreams van con el
# nombre completo del Service (el resolver de NGINX no usa los dominios de búsqueda): ConfigMap
# gateway-config, que cada overlay ajusta a su namespace.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/component: gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 18000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: nginx
          image: ghcr.io/trip-bus/api-gateway:prod
          ports:
            - name: http
              containerPort: 18000
          envFrom:
            - configMapRef:
                name: gateway-config
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
