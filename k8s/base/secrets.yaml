# PLANTILLAS de Secret: sin valores reales. Antes de desplegar crea los secretos de verdad (ver
# k8s/README.md, sección Secretos); kubectl apply -k NO debe aplicar estos marcadores en un clúster real.
apiVersion: v1
kind: Secret
metadata:
  name: tripbus-secrets
type: Opaque
stringData:
  REDIS_PASSWORD: "CAMBIAR"
  INTERNAL_API_TOKEN: "CAMBIAR"
  TICKET_SECRET: "CAMBIAR"
  PAYMENT_WEBHOOK_SECRET: "CAMBIAR"
  MFA_ENCRYPTION_KEY: "CAMBIAR"
  VAPID_PUBLIC_KEY: "CAMBIAR"
  VAPID_PRIVATE_KEY: "CAMBIAR"
  VAPID_SUBJECT: "CAMBIAR"
  IDENTITY_DB_USERNAME: "identity"
  IDENTITY_DB_PASSWORD: "CAMBIAR"
  CATALOG_DB_USERNAME: "catalog"
  CATALOG_DB_PASSWORD: "CAMBIAR"
  INVENTORY_DB_USERNAME: "inventory"
  INVENTORY_DB_PASSWORD: "CAMBIAR"
  BOOKING_DB_USERNAME: "booking"
  BOOKING_DB_PASSWORD: "CAMBIAR"
  FLEET_DB_USERNAME: "fleet"
  FLEET_DB_PASSWORD: "CAMBIAR"
  OFFERS_DB_USERNAME: "offers"
  OFFERS_DB_PASSWORD: "CAMBIAR"
---
# Llaves RSA con las que identity firma los JWT (montadas en /keys).
apiVersion: v1
kind: Secret
metadata:
  name: identity-jwt-keys
type: Opaque
stringData:
  private.pem: "CAMBIAR: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048"
  public.pem: "CAMBIAR: openssl rsa -in private.pem -pubout"
