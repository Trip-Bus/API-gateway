# Observabilidad (US-080 / transversal): métricas de todos los servicios (puertos internos de la red de Docker).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: tripbus
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity:18001
          - catalog-service:18002
          - seat-inventory-service:18003
          - booking-payment-service:18004
          - fleet-trip-events-service:18005
          - flash-offers-service:18006
          - realtime-gateway:18007
