# Observabilidad (HT-10): métricas de todos los servicios (puertos internos de la red de Docker) y alertas.
# Cada servicio etiqueta sus métricas con application=<nombre> (management.metrics.tags.application).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: tripbus
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity:18001
          - catalog-service:18002
          - seat-inventory-service:18003
          - booking-payment-service:18004
          - fleet-trip-events-service:18005
          - flash-offers-service:18006
          - realtime-gateway:18007
    relabel_configs:
      # servicio = host del target (identity, catalog-service, ...): sirve aunque el servicio esté caído.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: servicio
