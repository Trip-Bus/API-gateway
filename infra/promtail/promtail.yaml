# Promtail (HT-10): lee los logs de los contenedores de ESTE proyecto de compose (docker.sock) y los
# envía a Loki con las etiquetas servicio y proyecto. Los servicios Java con LOG_FORMAT=json escriben
# JSON ECS: se extraen nivel y traceId (Grafana enlaza el traceId con Tempo).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: contenedores
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=${COMPOSE_PROJECT_NAME}"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: servicio
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: proyecto
    pipeline_stages:
      - json:
          expressions:
            nivel: '"log.level"'
            traceId: traceId
      - labels:
          nivel:
